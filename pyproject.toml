[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vractl"
version = "1.0.0"
description = "Eina de línia d'ordres per gestionar VMs de VMware Aria Automation (vRA 8.x) via les accions de Day 2 de Service Broker"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["vmware", "aria-automation", "vrealize", "cli", "vm"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
vractl = "vractl:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[tool.setuptools]
py-modules = ["vractl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["F", "E9", "I"]